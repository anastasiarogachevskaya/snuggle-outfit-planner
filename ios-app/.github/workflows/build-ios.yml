name: Build iOS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install web deps and build (repository root)
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Install iOS wrapper deps
        working-directory: ios-app
        run: bun install

      - name: Add and sync iOS platform
        working-directory: ios-app
        run: |
          npx cap add ios || true
          npx cap sync ios

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app


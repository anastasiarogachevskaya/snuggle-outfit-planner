name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# A push to a branch with an open PR fires both events for the same commit;
# cancel the older, now-pointless run instead of burning double the minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache bun install cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      # A service-role key would grant full read/write over every account, so
      # catch one before it is ever pushed. (.env is committed on purpose, but
      # it must never hold anything beyond the publishable/anon key.)
      # Matches a real key *value* (a JWT, or Supabase's secret-key prefix),
      # not `process.env.SUPABASE_SERVICE_ROLE_KEY` which is a legitimate read.
      - name: Check no secret keys are committed
        run: |
          if git grep -nIE 'sb_secret_[A-Za-z0-9_-]{10,}|SERVICE_ROLE_KEY[[:space:]]*[=:][[:space:]]*.{0,3}eyJ' -- . ':!.github/workflows/ci.yml'; then
            echo "::error::A secret-looking key is committed. Move it to the deploy environment."
            exit 1
          fi

      # Fails the build if any TypeScript error (including preview type errors) reappears.
      - name: Typecheck
        run: bun run typecheck

      - name: Unit tests
        run: bun run test

      # Typecheck passing does not mean the SSR bundle actually builds, and a
      # broken build reaches production without this.
      - name: Production build
        run: bun run build

      - name: Capacitor version drift
        run: bun run check:capacitor

      - name: Get resolved Playwright version
        id: playwright-version
        run: |
          version=$(grep -m1 -oE '"playwright": \[\s*"playwright@[0-9.]+' bun.lock | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      # System deps (--with-deps) are what's actually slow here, not the
      # browser download, so only skip them — not the whole install — on a
      # cache hit; the browser binaries themselves are cheap to re-verify.
      - name: Install Playwright browsers
        run: bunx playwright install ${{ steps.playwright-cache.outputs.cache-hit == 'true' && 'chromium' || '--with-deps chromium' }}

      - name: End-to-end tests (iOS webview + desktop)
        run: bun run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
